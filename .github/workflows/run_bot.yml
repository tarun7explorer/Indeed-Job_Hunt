name: Indeed Auto-Apply Automation

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:        # Allows manual run from GitHub interface

jobs:
  auto-apply:
    runs-on: ubuntu-latest
    
    # Prevents concurrent runs from overwriting tracking data
    concurrency:
      group: auto-apply-job
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & System Dependencies
        run: |
          npx playwright install --with-deps chromium

      - name: Execute Application Bot
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDEED_COOKIES_BASE64: ${{ secrets.INDEED_COOKIES_BASE64 }}
          AUTO_SUBMIT: "true"
        run: python main.py

      - name: Commit and Push Updated Application Tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/applied_jobs.json data/failed_jobs.json
          git status
          git diff-index --quiet HEAD || git commit -m "auto: update applied jobs tracker [skip ci]"
          git push origin HEAD:${{ github.ref }}